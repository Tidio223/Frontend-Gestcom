<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="circle2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="150" fill="url(#circle1)" opacity="0.6"/>
  <circle cx="1700" cy="300" r="200" fill="url(#circle2)" opacity="0.5"/>
  <circle cx="1600" cy="800" r="180" fill="url(#circle1)" opacity="0.4"/>
  <circle cx="300" cy="900" r="120" fill="url(#circle2)" opacity="0.7"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="540" x2="1920" y2="540" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="0" y1="270" x2="1920" y2="270" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="white" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Abstract shapes -->
  <path d="M100 600 Q400 400 700 600 T1300 600" stroke="white" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M600 200 Q900 100 1200 200 T1800 200" stroke="white" stroke-width="2" fill="none" opacity="0.15"/>
  <path d="M200 800 Q500 700 800 800 T1400 800" stroke="white" stroke-width="2" fill="none" opacity="0.1"/>
</svg>
